name: Release
on:
  push:
    tags:
      - v*

env:
  MIHON_GITHUB_RELEASE: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    if: github.repository == 'OnoOno92/mangaku'
    name: Extract tag name
    runs-on: 'ubuntu-26.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    if: github.repository == 'OnoOno92/mangaku'
    name: Build
    runs-on: 'ubuntu-26.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is not set. See FORK.md, section 'Signing releases'."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/mangaku.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleRelease -Pdist=github
        env:
          storeFile: ${{ runner.temp }}/mangaku.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk mangaku-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk mangaku-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk mangaku-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk mangaku-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk mangaku-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangaku
          path: |
            mangaku-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-x86-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    if: github.repository == 'OnoOno92/mangaku'
    name: Build (FOSS)
    runs-on: ubuntu-26.04
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Decode signing keystore
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is not set. See FORK.md, section 'Signing releases'."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/mangaku.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleFoss -Pdist=foss
        env:
          storeFile: ${{ runner.temp }}/mangaku.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk mangaku-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangaku-foss
          path: mangaku-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    if: github.repository == 'OnoOno92/mangaku'
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [get_tag, build, build_foss]
    permissions:
      contents: write
      actions: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            mangaku
            mangaku-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Mangaku ${{ needs.get_tag.outputs.tag }}
          body: |
            Mangaku is a rebranded build of [Mihon](https://github.com/mihonapp/mihon), signed with this fork's own key and built without telemetry.
            Consider supporting upstream development on [Patreon](https://www.patreon.com/mihon/membership) or [OpenCollective](https://opencollective.com/mihon/contribute).

            <!-->



            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `mangaku-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            mangaku-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-${{ needs.get_tag.outputs.tag }}-foss.apk
            mangaku-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-x86-${{ needs.get_tag.outputs.tag }}.apk
            mangaku-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
